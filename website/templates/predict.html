<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predictive Maintenance System</title>
  <style>
    :root {
      --primary: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 2.5rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 1.25rem;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 0.5rem 0;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0 0 0.75rem 0;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #eff6ff;
      color: var(--accent);
      border: 1px solid #bfdbfe;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.4rem;
    }

    input {
      padding: 0.75rem 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-submit {
      grid-column: span 2;
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Predictive Maintenance System</h1>
      <p>Real-Time Industrial Asset Telemetry Diagnostics</p>
      <span class="badge">ML Classifier Active (Lab 12)</span>
    </div>

    <form action="/predict" method="POST" class="form-grid">
      <div class="form-group">
        <label for="air_temp">Air Temperature (K)</label>
        <input type="number" step="0.1" name="air_temp" id="air_temp" placeholder="e.g. 298.1" required>
      </div>

      <div class="form-group">
        <label for="process_temp">Process Temperature (K)</label>
        <input type="number" step="0.1" name="process_temp" id="process_temp" placeholder="e.g. 308.6" required>
      </div>

      <div class="form-group">
        <label for="rotational_speed">Rotational Speed (RPM)</label>
        <input type="number" name="rotational_speed" id="rotational_speed" placeholder="e.g. 1500" required>
      </div>

      <div class="form-group">
        <label for="torque">Torque (Nm)</label>
        <input type="number" step="0.1" name="torque" id="torque" placeholder="e.g. 40.0" required>
      </div>

      <div class="form-group full-width">
        <label for="tool_wear">Tool Wear (Minutes)</label>
        <input type="number" name="tool_wear" id="tool_wear" placeholder="e.g. 120" required>
      </div>

      <button type="submit" class="btn-submit">⚡ Run Failure Diagnostics</button>
    </form>
  </div>

</body>
</html>
