<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Assessment - Predictive Maintenance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }
        .container { background: #ffffff; color: #0f172a; border-radius: 16px; width: 100%; max-width: 550px; padding: 40px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { font-size: 1.8rem; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
        .header p { color: #64748b; font-size: 0.95rem; margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        label { font-weight: 600; font-size: 0.9rem; color: #334155; }
        .unit-badge { font-size: 0.75rem; background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; color: #0f172a; transition: border-color 0.2s ease, box-shadow 0.2s ease; outline: none; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        button { background: #2563eb; color: #ffffff; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; margin-top: 10px; }
        button:hover { background: #1d4ed8; transform: translateY(-1px); }
        .back-btn { display: block; text-align: center; margin-top: 18px; color: #64748b; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-btn:hover { color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚙️ Machine Telemetry Input</h2>
            <p>Specify operational parameters to simulate live machine risk.</p>
        </div>
        <form action="/predict" method="POST">
            <div class="form-group">
                <div class="label-row">
                    <label>Air Temperature</label>
                    <span class="unit-badge">Kelvin [K]</span>
                </div>
                <input type="number" step="0.1" name="air_temp" value="300.0" required>
            </div>
            <div class="form-group">
                <div class="label-row">
                    <label>Process Temperature</label>
                    <span class="unit-badge">Kelvin [K]</span>
                </div>
                <input type="number" step="0.1" name="proc_temp" value="310.0" required>
            </div>
            <div class="form-group">
                <div class="label-row">
                    <label>Rotational Speed</label>
                    <span class="unit-badge">RPM</span>
                </div>
                <input type="number" step="1" name="speed" value="1500" required>
            </div>
            <div class="form-group">
                <div class="label-row">
                    <label>Torque</label>
                    <span class="unit-badge">Nm</span>
                </div>
                <input type="number" step="0.1" name="torque" value="40.0" required>
            </div>
            <div class="form-group">
                <div class="label-row">
                    <label>Tool Wear</label>
                    <span class="unit-badge">Minutes</span>
                </div>
                <input type="number" step="1" name="tool_wear" value="100" required>
            </div>
            <button type="submit">Run Diagnostic Risk Assessment</button>
        </form>
        <a href="/" class="back-btn">← Back to Overview</a>
    </div>
</body>
</html>
